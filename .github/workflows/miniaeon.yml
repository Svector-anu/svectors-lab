name: MiniAeon

on:
  workflow_dispatch:
    inputs:
      skill:
        description: Skill to run. Empty runs every due skill.
        required: false
        default: ""
  schedule:
    - cron: "*/15 * * * *"
  repository_dispatch:
    types: [miniaeon-ping]
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, edited]

concurrency:
  group: miniaeon-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  issues: read
  pull-requests: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build miniaeon
        env:
          GH_TOKEN: ${{ github.token }}
          MINIAEON_SOURCE_TOKEN: ${{ secrets.MINIAEON_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          # By default build from this repo. When [actions].source_repo is set in
          # aeon.toml, build the binary from that repo instead, so a state-only
          # workspace (no Go source of its own) can still run on Actions. A private
          # source_repo needs a MINIAEON_SOURCE_TOKEN secret; github.token cannot
          # read other private repos.
          SRC_REPO="$(sed -n 's/^[[:space:]]*source_repo[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' aeon.toml | head -n1)"
          SRC_REF="$(sed -n 's/^[[:space:]]*source_ref[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' aeon.toml | head -n1)"
          if [ -n "$SRC_REPO" ]; then
            echo "building miniaeon from $SRC_REPO${SRC_REF:+@$SRC_REF}"
            TOKEN="${MINIAEON_SOURCE_TOKEN:-$GH_TOKEN}"
            git clone --depth 1 ${SRC_REF:+--branch "$SRC_REF"} \
              "https://x-access-token:${TOKEN}@github.com/${SRC_REPO}.git" "$RUNNER_TEMP/miniaeon-src"
            ( cd "$RUNNER_TEMP/miniaeon-src" && go build -o "$GITHUB_WORKSPACE/miniaeon" ./cmd/miniaeon )
          else
            go build -o miniaeon ./cmd/miniaeon
          fi
          ./miniaeon version

      - name: Install omp
        env:
          OMP_VERSION: v18.1.21
          OMP_SHA256: 0d9dfcc4561b5877f571cac81226fe8a1466d951cb840e091f3f82a684b3fde4
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/omp "https://github.com/can1357/oh-my-pi/releases/download/${OMP_VERSION}/omp-linux-x64"
          echo "${OMP_SHA256}  /tmp/omp" | sha256sum -c -
          chmod +x /tmp/omp
          sudo mv /tmp/omp /usr/local/bin/omp
          omp --version

      - name: Configure git
        run: |
          git config user.name "miniaeon"
          git config user.email "miniaeon@users.noreply.github.com"

      - name: Run skill
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_SKILL: ${{ inputs.skill }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ -z "${ANTHROPIC_API_KEY-}${OPENAI_API_KEY-}${OPENROUTER_API_KEY-}${XAI_API_KEY-}${GEMINI_API_KEY-}" ]; then
            echo "no provider API key in secrets; skipping run (local subscriptions are not on this runner)"
            exit 0
          fi
          EVENT="${GITHUB_EVENT_NAME:-}"
          # repository_dispatch is an external pinger that only WAKES the
          # scheduler (run-due). It never dispatches a skill directly.
          if [ "$EVENT" = "repository_dispatch" ]; then
            ./miniaeon run-due
          elif [ "$EVENT" = "schedule" ] || [ "$EVENT" = "workflow_dispatch" ]; then
            if [ -n "${INPUT_SKILL:-}" ]; then
              ./miniaeon run "$INPUT_SKILL"
            else
              ./miniaeon run-due
            fi
          else
            ./miniaeon run-event
          fi

      - name: Push publication
        id: publish
        run: |
          set -euo pipefail
          git status --short
          if ! git rev-parse --abbrev-ref --symbolic-full-name @{u} >/dev/null 2>&1; then
            echo "unpublished=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # miniaeon sync pulls --rebase and pushes, regenerating the derived
          # rollups (cron-state, ranking, daily log) from the event ledger on a
          # conflict instead of stalling on them - so an Actions push that races a
          # concurrent local publish self-heals rather than looping to no effect. A
          # failure here is publication-pending, not a skill failure: record it and
          # let the artifact fallback carry the state to the next run.
          if ./miniaeon sync; then
            echo "unpublished=false" >> "$GITHUB_OUTPUT"
          else
            echo "push failed; publication is pending, not a skill failure"
            echo "unpublished=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload unpublished state
        if: failure() || steps.publish.outputs.unpublished == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unpublished-${{ github.run_id }}
          path: |
            memory/
            output/
          if-no-files-found: ignore
          retention-days: 7
