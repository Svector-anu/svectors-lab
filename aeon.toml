version = 1

[omp]
provider = "anthropic"
profile = "miniaeon"
binary = "omp"

[scheduler]
timezone = "UTC"
tick_seconds = 300
catch_up_hours = 12
circuit_fails = 3
circuit_pause_hours = 6
stuck_after_minutes = 45

# The generated GitHub Actions workflow builds the miniaeon binary before each
# run. By default it builds from THIS repo, so a repo carrying the workspace must
# also carry the miniaeon source. Set source_repo to an "owner/name" slug to
# build from a separate source repo instead, which lets a state-only workspace
# repo run on Actions. source_ref pins a branch or tag; empty uses that repo's
# default branch. Change it with `miniaeon source set <owner/repo> [--ref x]`.
# A private source_repo needs a MINIAEON_SOURCE_TOKEN secret with read access.
[actions]
source_repo = "aaronjmars/miniaeon"
source_ref = "main"

[models]
top = "anthropic/claude-sonnet-5"
standard = "anthropic/claude-sonnet-5"
small = "anthropic/claude-haiku-4-5-20251001"
scorer = "anthropic/claude-haiku-4-5-20251001"

[cascade]
# Actions holds an anthropic subscription token; this laptop has an OpenRouter
# key. One config has to work in both, so cascade on auth as well: the run
# tries anthropic, and falls through to openrouter where that credential is the
# one that exists. Without "auth" in this list a missing credential is a hard
# run failure instead of a fallback.
order = ["anthropic", "openrouter"]
on = ["unavailable", "rate_limited", "quota_exceeded", "timeout", "auth"]

[subscriptions.primary]
provider = "auto"
# renewal_date = "2026-09-15"
# renewal_time = "00:00"
# timezone = "America/Toronto"   # renewal wall-clock zone; defaults to [scheduler].timezone
usage_target_percent = 80
reserve_percent = 10
# no discoverable omp usage row on a pay-as-you-go provider key; let scheduled
# work proceed instead of gating every non-verifier skill. set to false once a
# real subscription with a readable quota is configured.
allow_unknown_usage = true

[channels.telegram]
enabled = true

[channels.slack]
enabled = false

[maintenance]
enabled = true
allow_prs = false

# The self-directed loop (section 17). Off by default; enable on one
# non-critical instance running the local daemon. default_wake_minutes is the
# gap between ticks when the loop names none; daily_cost_cap_usd of 0 leaves
# only the scheduler-wide cap.
[heartbeat]
enabled = false
default_wake_minutes = 30
daily_cost_cap_usd = 0.0

[grants.notify]
capabilities = ["sends_notifications"]

[grants.web]
capabilities = ["public_web_read", "external_api"]

[grants.repo-read]
capabilities = ["repository_read"]
targets = ["Svector-anu/svectors-lab"]

[grants.repo-write]
capabilities = ["repository_write"]
targets = ["Svector-anu/svectors-lab"]

[skills.heartbeat]
enabled = true
schedule = "0 8 * * *"
runtime = "any"
model = "small"
role = "verifier"
risk = "low"
write_scope = "own-memory"
on_missed_run = "catch_up"

[skills.digest]
enabled = false
schedule = "0 14 * * *"
runtime = "any"
model = "standard"
role = "thinker"
risk = "low"
write_scope = "own-memory"
on_missed_run = "catch_up"

[skills.memory-flush]
enabled = true
schedule = "0 3 * * 0"
runtime = "any"
model = "small"
role = "worker"
risk = "low"
write_scope = "shared-memory"
on_missed_run = "run_latest_only"


[skills.memory-flush.permissions]
write = ["memory/memory-flush-state.json", "output/articles"]
[skills.github-monitor]
enabled = false
schedule = "0 12 * * *"
runtime = "any"
model = "small"
role = "worker"
risk = "low"
write_scope = "own-memory"
on_missed_run = "skip_stale"

