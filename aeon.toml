# The proof gate: dispatches the changed skill from the PR head, waits for the
# correlated run, requires a successful conclusion and non-empty output, and
# re-checks the immutable PR SHA before posting a receipt. Manual-only; it is
# the last step of a composition, never something to fire on a schedule.
[skills.create-prove]
enabled = true
schedule = ""
runtime = "any"
model = "standard"
role = "verifier"
risk = "medium"
write_scope = "own-memory"
on_missed_run = "skip_stale"
