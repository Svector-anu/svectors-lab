on_missed_run = "run_latest_only"

# Recommended, installed disabled. Enable after you inspect it.

[skills.skill-health.permissions]
write = ["memory/issues", "output/articles"]
[skills.changelog]
enabled = false
schedule = "0 20 * * 1"
runtime = "any"
model = "small"
role = "thinker"
risk = "low"
write_scope = "own-memory"
on_missed_run = "run_latest_only"

[skills.evolve]
enabled = false
schedule = "0 18 * * 1"
runtime = "any"
model = "standard"
role = "thinker"
risk = "high"
write_scope = "skills"
on_missed_run = "skip_stale"
requires = ["skill-health"]
min_score = 3

[skills.monolith]
enabled = true
schedule = ""
runtime = "any"
model = "standard"
role = "thinker"
risk = "low"
write_scope = "own-memory"
on_missed_run = "skip_stale"

# The Epoch composition under test: feature builds and opens a PR, pr-review
# verifies it independently, create-prove re-checks the immutable PR SHA and
# captures behavioral evidence. Aeon expressed this as a declared chain with
# var: "$feature_pr" passing step 1's output into step 2. MiniAeon has no
# variable passing between runs, so pr-review must discover the PR from the
# ledger. Whether that is sufficient is the thing this wiring exists to answer.
[skills.monolith.delegate]
skills = ["digest", "github-monitor", "memory-flush", "changelog", "feature", "pr-review", "create-prove"]
actions = ["run"]

