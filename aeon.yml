  # harness: grok, pinned 2026-08-25 — codex (native ChatGPT Plus) refused
  # mid-scan with a real OpenAI account-level policy gate: "This content was
  # flagged for possible cybersecurity risk... join the Trusted Access for
  # Cyber program" (run 32794896376). Not a bug, not fixable from our side
