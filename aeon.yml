# Reactive triggers — event-driven skill dispatch based on cron-state.json conditions.
# Skills with schedule: "reactive" are never cron-matched. Instead, the scheduler
# evaluates their trigger rules after processing cron skills.
#
# Format: trigger: { on: <source-skill>, when: "<condition>" }
# Conditions (evaluated by scripts/reactive_when.sh):
#   consecutive_failures >= N    - source skill failed N+ times in a row
#   success_rate <op> X          - success rate vs threshold; op is < <= > >= and X
#                                  is a 0.0-1.0 float. Only checked once the source
#                                  skill has run at least once (a never-run skill is
#                                  0.0 and would otherwise false-fire `< X`).
#   last_status = <value>        - source skill's last run ended <value> (e.g.
#                                  success), for chaining
#
# Multiple triggers: trigger: [{ on: a, when: "..." }, { on: b, when: "..." }]
# Any matching trigger fires the skill (OR logic).
reactive:
  # skill-repair:
  #   trigger:
  #     - { on: "*", when: "consecutive_failures >= 3" }
  # autoresearch:
  #   trigger:
  #     - { on: skill-health, when: "last_status = success" }

# Chains — multi-step skill pipelines with parallel execution and output passing.
# Steps run sequentially; use parallel: [...] for concurrent execution within a step.
# Skills with consume: [...] receive prior step outputs injected into their context.
#
# Format:
#   chains:
#     chain-name:
#       schedule: "cron expression"
#       on_error: fail-fast          # fail-fast (default) | continue
#       max_dispatches: 10           # optional total-dispatch cap for the chain
#       steps:
#         # Multi-key steps use flow-brace form so they stay valid YAML when uncommented.
#         - { parallel: [skill-a, skill-b] }
#         - { skill: skill-c, consume: [skill-a, skill-b] }
#         # Conditional routing on the consumed skill's Haiku score (1-5). A step
#         # with when: runs only if the condition holds; a missing score does NOT
#         # fire, so always pair branches with an unconditional fall-through.
#         # Operators: == != < > <= >= (ordering needs an integer on both sides).
#         - { skill: polish,  consume: [skill-c], when: "score > 3" }
#         - { skill: rewrite, consume: [skill-c], when: "score <= 3" }
chains:
  web3-stack-watch:
    schedule: "workflow_dispatch"
    on_error: fail-fast
    max_dispatches: 2
    steps:
      - { skill: rightstack, var: "consumer app on Base with an embedded wallet" }
      - { skill: digest, var: "web3 developer tooling", consume: [rightstack] }

  # Cross-model dev loop: the writer opens a PR, a separately pinned reviewer checks
  # it, and a human merges. chain-runner dispatches each step through aeon.yml, so
  # each skill keeps its own harness override.
  # workflow_dispatch only. It requires the chain's `target` input, e.g.
  # external:owner/repo or external:owner/repo#12; empty targets are rejected rather
  # than falling back to the watched-repos sweep.
  # Never let this run unattended against a repo you don't own until the output has
  # been read by hand several times. The reviewer receives only a PR that GitHub
  # shows was newly opened by the preceding feature step.
  dev-loop:
    schedule: "workflow_dispatch"
    on_error: fail-fast
    max_dispatches: 4
    steps:
      - { skill: feature, var: "$chain_target" }
      - { skill: pr-review, var: "$feature_pr", consume: [feature] }

  # routine:
  #   schedule: "0 7 * * *"
  #   on_error: fail-fast
  #   steps:
  #     - parallel: [token-movers, hn-digest, issue-triage, github-trending]
  #     - skill: routine, consume: [token-movers, hn-digest, issue-triage, github-trending]

# Default model for all skills. Override per-run via workflow_dispatch.
# Options: claude-opus-4-8, claude-fable-5, claude-sonnet-5, claude-sonnet-4-6, claude-haiku-4-5-20251001
# (Grok harness model: grok-4.5, the flagship reasoning model and grok's current
#  default, run with --no-subagents in CI. It's the only id the grok CLI accepts on an
#  X-account login, and it's the gateway default too. The older coding ids
#  (grok-build-0.1, grok-composer-2.5-fast, grok-4.3) are gateway-only, reachable via
#  XAI_API_KEY + the GROK_MODEL var.)
# The non-claude harnesses use their OWN model ids (codex openai/*, kimi moonshotai/*,
# vibe mistralai/*, pi deepseek/*, fx AI_GATEWAY_API_KEY-backed) — surfaced in the
# dashboard picker per harness; see docs/harnesses.md. The value below only
# applies to the claude/grok harnesses.
model: claude-sonnet-5

# Agent harness — which coding-agent CLI runs your skills.
#   claude (default)  — Claude Code (`claude -p`); uses the AI Gateway below.
#   grok              — Grok Build (`grok`); logs in with your X account
#                       (GROK_CREDENTIALS, captured in the dashboard) or an
#                       XAI_API_KEY. Bypasses the gateway (grok has its own auth).
#   codex/pi/vibe/kimi — OpenAI Codex, Pi, Mistral Vibe, Moonshot Kimi — run through
#                       harness-adapter/run-harness (one Claude-Code-shaped contract),
#                       added in this fork sync. A single OPENROUTER_API_KEY drives
#                       all four, or each can use its own native auth (ChatGPT/
#                       Moonshot login, provider key). See docs/harnesses.md for
#                       models, auth, and verification.
# Override per-skill with `harness: "<name>"` in the skill entry, or per-run via
# the workflow_dispatch `harness` input.
#
# Operational history (this fork, pre-sync):
# Re-enabled grok 2026-07-28, correcting a 2026-07-26 revert: those consistent
# ~29m59s timeouts weren't grok-build's weight — they were an expired
# GROK_CREDENTIALS (X-account OAuth) session, which makes grok silently fall
# back to an interactive device-auth prompt that hangs unattended in CI until
# the device code expires (~30min). Root-caused via a live local `grok login`
# (kill strays fighting over ~/.grok/auth.json.lock before re-authing).
#
# Switched to grok the same day: both CLAUDE_CODE_OAUTH_TOKEN (direct) and
# BANKR_LLM_KEY (gateway) were dead at the time — claude failed in ~3s
# (rate/usage ceiling) and Bankr 402'd with $0 balance — so grok was the only
# funded, working path.
#
# Switched back to claude 2026-07-30: the "~3s rate/usage ceiling" was
# actually a stale CLAUDE_CODE_OAUTH_TOKEN (401 "OAuth access token is
# invalid") — refreshed via `claude setup-token`, verified working via live
# dispatch (heartbeat + vuln-scanner, harness=claude, both delivered). grok's
# GROK_CREDENTIALS session was fine but the account's Grok Build usage balance
# was exhausted (402) with no reset after 40+ hours. Revert to grok only once
# its usage resets/is funded, or if CLAUDE_CODE_OAUTH_TOKEN goes stale again.
#
# Reverted from fx 2026-08-24: fx landed on this value as an unintended
# side effect of clicking through the harness picker to verify it now renders
# fx as an option (a real dashboard bug — a model-only PATCH silently also
# wrote a stale harness value; the race itself is fixed now, see #944). This
# repo has no AI_GATEWAY_API_KEY/VERCEL_OIDC_TOKEN configured, and fx has no
# OpenRouter fallback (see resolve-harness.sh's fx case), so every skill was
# failing closed immediately on MissingCredentials. Don't set harness: fx
# again until those secrets are actually provisioned.
#
# Switched to codex 2026-08-24: both harness=claude gateway candidates
# (claude, bankr) are dead — claude 429 weekly-limit (resets Aug 26 1pm
# UTC), bankr 402 insufficient LLM Gateway credits — confirmed from a real
# failed run's log, not inferred. 24% pass rate over the trailing 168h
# (./scripts/skill-runs --hours 168) as a direct result. CODEX_AUTH is now
# provisioned (native ChatGPT-subscription auth, bypasses the gateway
# entirely — see resolve-harness.sh's codex case). Verified working via a
# real dispatched defi-overview run (harness: codex, auth: native-oauth,
# real regime-verdict output, not a stub).
#
# TESTING kimi 2026-08-25: codex is also the operator's own personal daily
# driver (VS Code interactive coding), so fleet dispatches and personal
# sessions were drawing on the same shared ChatGPT Plus account/cap —
# separating them is the actual goal here, not a preference for kimi's
# quality specifically. Picked kimi over grok because grok already has a
# documented history on THIS repo of exhausting its usage balance with no
# reset after 40+ hours (see the reverted-from-grok note above); kimi is
# unproven at fleet scale but has no such history yet. Real, unresolved
# risk found before switching (not assumed away): Kimi Code's own
# subscription plans carry a weekly allowance + 5-hour rate limit on top of
# a shared monthly credit pool — exact numbers for this specific account's
# tier are unknown, so this could hit its own wall the same way claude and
# grok did.
#
# REVERTED to codex 2026-08-25, same day: the first real dispatch through
# CI failed with `auth.login_required: OAuth provider "managed:kimi-code"
# requires login before it can be used` (run 32793015699). Root-caused as
# far as it can be from here — NOT a missing-file gap (harness-auth.ts's
# credPaths already captures credentials/+config.toml correctly, and
# KIMI_AUTH is provisioned right), NOT a kimi-code version mismatch
# (install-harness.sh pins @0.28.0; reproduced clean with a real "pong"
# using kimi-code@0.28.0 against a completely fresh, isolated $HOME
# containing ONLY the two captured paths — proves the capture itself is
# 100% correct). The failure only reproduces inside the actual GitHub
# Actions runner, not locally — most likely Moonshot's OAuth/token-refresh
# endpoint rejecting requests from GitHub's datacenter IP ranges (a real
# pattern some providers use against automated/cloud traffic), though this
# couldn't be confirmed further without CI-side network access. Genuine
# external blocker, not a bug on our end that more debugging would fix.
# Don't retry kimi as the fleet harness until this is understood — codex
# is proven working end-to-end and stays the default.
harness: codex

# AI Gateway — route Claude Code requests through an LLM provider.
#
# provider: auto (default) resolves at RUN TIME from whichever provider secret
# is set, in priority order — no need to re-pin when you add/remove a key:
#   claude (CLAUDE_CODE_OAUTH_TOKEN) → anthropic (ANTHROPIC_API_KEY) →
#   openrouter → bankr → usepod → venice → surplus → grok → direct (fallback)
# Override the order with the repo variable GATEWAY_ORDER (space-separated).
#
# Or PIN one explicitly: direct | bankr | openrouter | usepod | venice | surplus | grok.
# grok routes Claude Code at xAI's Anthropic-compatible api.x.ai (XAI_API_KEY) —
# this is the gateway path; to run the grok CLI itself, set `harness: grok` above.
# For Anthropic-compatible endpoints (direct), set repo variable ANTHROPIC_BASE_URL
# + secret ANTHROPIC_API_KEY. Example: https://api.deepseek.com/anthropic
# Bankr docs: https://docs.bankr.bot/llm-gateway/overview
gateway:
  provider: auto

# Output channels
channels:
  jsonrender:
    enabled: true # Set to true (or JSONRENDER_ENABLED=true as repo var) to write json-render specs

# Messaging integration
# Polls for messages every 5 minutes on Telegram/Discord/Slack.
telegram:
  enabled: true

# Observability (optional) — no config lives here; it's credential-driven.
# Set the repo secrets LANGFUSE_PUBLIC_KEY + LANGFUSE_SECRET_KEY and every
# Claude Code run streams to your Langfuse project as a trace (LLM calls,
# tokens, cost, prompts/responses). Region/toggles are repo variables:
# LANGFUSE_HOST (default EU cloud), LANGFUSE_TRACING (0 to disable),
# LANGFUSE_LOG_CONTENT (0 = metadata only). See docs/langfuse.md.
